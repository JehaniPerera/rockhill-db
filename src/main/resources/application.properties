spring.application.name=reception-hall

# MySQL must be running. The database is created automatically on the first start.
# Defaults match a standard XAMPP / local MySQL install: user "root" with an EMPTY password.
# If your MySQL has a password, do NOT edit this file. Set an environment variable instead
# (in IntelliJ: Run > Edit Configurations > Environment variables):  DB_PASSWORD=your_password
spring.datasource.url=jdbc:mysql://localhost:3306/rockhill_app?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Load schema.sql and data.sql (sample data) on every start, after Hibernate has made the tables.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

server.port=8081
server.error.include-message=always
