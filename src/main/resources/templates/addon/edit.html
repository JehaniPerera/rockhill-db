<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu-layout :: head('Edit Add-on')}"></head>
<body>
<header th:replace="~{fragments/menu-layout :: nav}"></header>
<main class="container">
    <p><a th:href="@{/admin/addons}">← Back to add-ons</a></p>
    <h1>Edit Add-on</h1>
    <form class="edit-form" th:action="@{/admin/addons/{id}/edit(id=${addOn.addonId})}" th:object="${addOn}" method="post">
        <label>Name
            <input type="text" th:field="*{name}" required>
        </label>
        <label>Price
            <input type="number" step="0.01" th:field="*{price}" required>
        </label>
        <label>Unit
            <select th:field="*{unitType}">
                <option value="per item">per item</option>
                <option value="per guest">per guest</option>
            </select>
        </label>
        <label class="check"><input type="checkbox" th:field="*{includedInPackage}"> Included in package</label>
        <label class="check"><input type="checkbox" th:field="*{isWeddingExclusive}"> Wedding only</label>
        <button type="submit">Save changes</button>
        <a class="btn btn-secondary" th:href="@{/admin/addons}">Cancel</a>
    </form>
</main>
</body>
</html>
