<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Manage Menus</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 800px; margin: 30px auto; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 25px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #2c3e50; color: white; }
        input { padding: 6px; margin-right: 8px; }
        button { padding: 6px 12px; cursor: pointer; }
    </style>
</head>
<body>
<h1>Menu Catalog</h1>

<table>
    <tr>
        <th>ID</th><th>Name</th><th>Price per guest</th><th>Action</th>
    </tr>
    <tr th:each="m : ${menus}">
        <td th:text="${m.menuId}"></td>
        <td th:text="${m.name}"></td>
        <td th:text="${m.pricePerGuest}"></td>
        <td>
            <form th:action="@{/admin/menus/{id}/delete(id=${m.menuId})}" method="post">
                <button type="submit">Delete</button>
            </form>
        </td>
    </tr>
</table>

<h2>Add a new menu</h2>
<form th:action="@{/admin/menus}" th:object="${newMenu}" method="post">
    <input type="text" th:field="*{name}" placeholder="Menu name" required>
    <input type="number" step="0.01" th:field="*{pricePerGuest}" placeholder="Price per guest" required>
    <button type="submit">Add Menu</button>
</form>
</body>
</html>
