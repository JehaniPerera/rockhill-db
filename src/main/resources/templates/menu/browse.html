<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Our Menus</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 900px; margin: 30px auto; }
        .cards { display: flex; flex-wrap: wrap; gap: 15px; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 15px; width: 250px; }
        .card h3 { margin-top: 0; }
        .price { color: #2c3e50; font-weight: bold; }
    </style>
</head>
<body>
<h1>Choose Your Menu</h1>
<div class="cards">
    <div class="card" th:each="m : ${menus}">
        <h3 th:text="${m.name}"></h3>
        <p class="price">Rs. <span th:text="${m.pricePerGuest}"></span> per guest</p>
    </div>
</div>
</body>
</html>
