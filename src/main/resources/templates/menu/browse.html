<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu-layout :: head('Our Menus')}"></head>
<body>
<header th:replace="~{fragments/menu-layout :: nav}"></header>
<main class="container">
    <h1>Choose Your Menu</h1>
    <div class="cards">
        <div class="card" th:each="m : ${menus}">
            <h3 th:text="${m.name}"></h3>
            <p class="price">Rs. <span th:text="${#numbers.formatDecimal(m.pricePerGuest, 1, 'COMMA', 2, 'POINT')}"></span> per guest</p>

            <!-- RESERVED: dishes section goes here later. Not built yet. -->
            <div class="card-dishes"></div>

            <!-- PENDING: selecting a menu needs the booking code from Function 1 -->
            <button type="button" class="btn-select" disabled>Select this menu</button>
            <p class="pending-note">Selection available once booking is connected.</p>
        </div>
    </div>
</main>
</body>
</html>
