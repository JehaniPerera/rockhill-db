<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu-layout :: head('Manage Decor')}"></head>
<body>
<header th:replace="~{fragments/menu-layout :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments/menu-layout :: messages}"></div>
    <p><a th:href="@{/admin/catalog}">← Back to catalog</a></p>
    <h1>Decor Catalog</h1>
    <table>
        <tr>
            <th>ID</th><th>Category</th><th>Name</th><th>Price</th>
            <th>One per category</th><th>Status</th><th>Action</th>
        </tr>
        <tr th:each="d : ${options}" th:classappend="${!d.active} ? 'row-disabled'">
            <td th:text="${d.decorId}"></td>
            <td th:text="${d.category}"></td>
            <td th:text="${d.name}"></td>
            <td th:text="${#numbers.formatDecimal(d.price, 1, 'COMMA', 2, 'POINT')}"></td>
            <td th:text="${d.isSingular} ? 'Yes' : 'No'"></td>
            <td>
                <span class="badge" th:if="${d.active}">Active</span>
                <span class="badge badge-off" th:unless="${d.active}">Disabled</span>
            </td>
            <td>
                <a class="btn" th:href="@{/admin/decor/{id}/edit(id=${d.decorId})}">Edit</a>
                <form th:if="${d.active}" th:action="@{/admin/decor/{id}/disable(id=${d.decorId})}" method="post" style="display:inline">
                    <button type="submit" class="btn-secondary">Disable</button>
                </form>
                <form th:unless="${d.active}" th:action="@{/admin/decor/{id}/enable(id=${d.decorId})}" method="post" style="display:inline">
                    <button type="submit">Enable</button>
                </form>
                <form th:action="@{/admin/decor/{id}/delete(id=${d.decorId})}" method="post" style="display:inline">
                    <button type="submit" class="btn-danger">Delete</button>
                </form>
            </td>
        </tr>
    </table>

    <h2>Add a decor option</h2>
    <form class="form-row" th:action="@{/admin/decor}" th:object="${newDecor}" method="post">
        <input type="text" th:field="*{category}" list="category-list" placeholder="Category" required>
        <datalist id="category-list">
            <option th:each="c : ${categories}" th:value="${c}"></option>
        </datalist>
        <input type="text" th:field="*{name}" placeholder="Decor name" required>
        <input type="number" step="0.01" th:field="*{price}" placeholder="Price" required>
        <label><input type="checkbox" th:field="*{isSingular}"> One per category</label>
        <button type="submit">Add Decor</button>
    </form>
</main>
</body>
</html>
