<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/menu-layout :: head('Edit Decor')}"></head>
<body>
<header th:replace="~{fragments/menu-layout :: nav}"></header>
<main class="container">
    <div th:replace="~{fragments/menu-layout :: messages}"></div>
    <p><a th:href="@{/admin/decor}">← Back to decor</a></p>
    <h1>Edit Decor Option</h1>
    <form class="edit-form" th:action="@{/admin/decor/{id}/edit(id=${decor.decorId})}" th:object="${decor}" method="post">
        <label>Category
            <input type="text" th:field="*{category}" list="category-list" required>
            <datalist id="category-list">
                <option th:each="c : ${categories}" th:value="${c}"></option>
            </datalist>
        </label>
        <label>Name
            <input type="text" th:field="*{name}" required>
        </label>
        <label>Price
            <input type="number" step="0.01" th:field="*{price}" required>
        </label>
        <label class="check"><input type="checkbox" th:field="*{isSingular}"> One per category</label>
        <button type="submit">Save changes</button>
        <a class="btn btn-secondary" th:href="@{/admin/decor}">Cancel</a>
    </form>
</main>
</body>
</html>
