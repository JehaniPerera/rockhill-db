<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rockhill Reception Hall - Staff Assignment</title>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--tx:#1d2330;--mut:#6b7385;--ac:#7a1f3d;--ok:#1b7f4b;--er:#b3261e;--bd:#dfe2e8}
  @media(prefers-color-scheme:dark){:root{--bg:#14171e;--card:#1e222c;--tx:#e8eaf0;--mut:#9aa1b3;--ac:#d4577f;--ok:#4cc38a;--er:#ff7b72;--bd:#323848}}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--tx)}
  header{background:var(--ac);color:#fff;padding:14px 20px;font-size:1.15rem;font-weight:600}
  main{max-width:960px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin-bottom:14px}
  .bar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
  label.f{display:flex;flex-direction:column;font-size:.8rem;color:var(--mut);gap:3px}
  input,select{padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font:inherit}
  button{padding:7px 13px;border:0;border-radius:6px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
  button.g{background:var(--ok)} button.r{background:var(--er)} button.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
  nav{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
  nav button{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
  nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
  .tab{display:none}.tab.on{display:block}
  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd);font-size:.92rem}
  .row{display:block;padding:6px 0;border-bottom:1px solid var(--bd)}
  small,em{color:var(--mut)}
  .tag{padding:2px 8px;border-radius:99px;font-size:.75rem;color:#fff}
  .PENDING_CONFIRMATION{background:#b7791f}.CONFIRMED{background:var(--ok)}.UNAVAILABLE{background:var(--er)}
  #msg{padding:9px 12px;border-radius:6px;margin-bottom:14px;display:none}
  #msg.ok{display:block;border:1px solid var(--ok);color:var(--ok)}
  #msg.err{display:block;border:1px solid var(--er);color:var(--er)}
  h3{margin:0 0 8px} ul{margin:4px 0;padding-left:20px}
</style>
</head>
<body>
<header>Rockhill Reception Hall &middot; Staff Assignment</header>
<main>
  <div class="card bar">
    <label class="f">Booking ID<input id="bid" type="number" value="7" min="1" style="width:90px"></label>
    <label class="f">Event date<input id="day" type="date" value="2027-01-09"></label>
    <button class="s" onclick="refresh()">Reload</button>
  </div>
  <div id="msg"></div>

  <nav id="nav">
    <button data-t="client" class="on">1. Client selection</button>
    <button data-t="manager">2. Manager confirmation</button>
    <button data-t="reports">3. Reports</button>
    <button data-t="staff">Staff records</button>
  </nav>

  <section id="client" class="tab on card">
    <h3>Client: pick staff / vendors for this event</h3>
    <div id="clientList"></div><br>
    <button onclick="run(sendSelection)">Send selection</button>
  </section>

  <section id="manager" class="tab card">
    <h3>Manager: call each person and record the answer</h3>
    <div id="mgrList"></div>
  </section>

  <section id="reports" class="tab card">
    <div id="repBox"></div>
  </section>

  <section id="staff" class="tab card">
    <h3>Staff &amp; vendors</h3>
    <div class="bar" style="margin-bottom:12px">
      <label class="f">Name<input id="nName"></label>
      <label class="f">Role<input id="nRole"></label>
      <label class="f">Type<select id="nType"><option>Internal</option><option>Vendor</option></select></label>
      <label class="f">Contact<input id="nContact"></label>
      <button onclick="run(addStaff)">Add</button>
    </div>
    <div id="staffTable"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bid = () => $('bid').value, day = () => $('day').value;
let staff = [], tab = 'client';

async function api(method, url, body) {
  const r = await fetch('/api' + url, {method, headers: {'Content-Type': 'application/json'},
                                       body: body ? JSON.stringify(body) : undefined});
  const t = await r.text(); let d = null;
  try { d = t ? JSON.parse(t) : null; } catch (e) {}
  if (!r.ok) throw new Error(d && d.error ? d.error : 'Request failed (' + r.status + ')');
  return d;
}
function msg(t, ok = true) { const m = $('msg'); m.textContent = t; m.className = ok ? 'ok' : 'err'; }
async function run(fn) { try { await fn(); } catch (e) { msg(e.message, false); } }
const nameOf = id => { const s = staff.find(x => x.id === id); return s ? s.name + ' (' + s.role + ')' : '#' + id; };
const list = a => a.length ? '<ul>' + a.map(s => '<li>' + esc(s.name) + ' <small>' + esc(s.role) + '</small></li>').join('') + '</ul>' : '<em>none</em>';

document.querySelectorAll('#nav button').forEach(b => b.onclick = () => {
  tab = b.dataset.t;
  document.querySelectorAll('#nav button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x.id === tab));
  refresh();
});
function refresh() { run({client: loadClient, manager: loadManager, reports: loadReports, staff: loadStaff}[tab]); }

// ---- 1. client ----
async function loadClient() {
  staff = await api('GET', '/staff');
  const free = new Set((await api('GET', '/staff/available?date=' + day())).map(s => s.id));
  $('clientList').innerHTML = staff.map(s =>
    `<label class="row"><input type="checkbox" value="${s.id}" ${free.has(s.id) ? '' : 'disabled'}> ${esc(s.name)}
     <small>${esc(s.role)} &middot; ${esc(s.type)}</small> ${free.has(s.id) ? '' : '<em>(busy on this date)</em>'}</label>`).join('');
}
async function sendSelection() {
  const ids = [...document.querySelectorAll('#clientList input:checked')].map(i => +i.value);
  if (!ids.length) return msg('Pick at least one person', false);
  const busy = await api('POST', '/bookings/' + bid() + '/select', {date: day(), staffIds: ids});
  msg('Saved as pending confirmation.' + (busy.length ? ' Skipped (busy): ' + busy.map(s => s.name).join(', ') : ''));
  loadClient();
}

// ---- 2. manager ----
async function loadManager() {
  staff = await api('GET', '/staff');
  const rows = await api('GET', '/bookings/' + bid() + '/assignments?date=' + day());
  const free = await api('GET', '/staff/available?date=' + day());
  const opts = free.map(s => `<option value="${s.id}">${esc(s.name)} (${esc(s.role)})</option>`).join('');
  if (!rows.length) { $('mgrList').innerHTML = '<em>No staff selected for this booking yet.</em>'; return; }
  $('mgrList').innerHTML = '<table><tr><th>Staff</th><th>Status</th><th>Action</th></tr>' + rows.map(a => {
    let act = '';
    if (a.status === 'PENDING_CONFIRMATION')
      act = `<button class="g" onclick="run(()=>confirmIt(${a.staffId},true))">Available</button>
             <button class="r" onclick="run(()=>confirmIt(${a.staffId},false))">Not available</button>`;
    if (a.status === 'UNAVAILABLE')
      act = `<select id="sw${a.staffId}">${opts}</select> <button onclick="run(()=>swap(${a.staffId}))">Swap</button>`;
    act += ` <button class="s" onclick="run(()=>dropIt(${a.staffId}))">Remove</button>`;
    return `<tr><td>${esc(nameOf(a.staffId))}</td><td><span class="tag ${a.status}">${a.status.replace('_', ' ')}</span></td><td>${act}</td></tr>`;
  }).join('') + '</table>';
}
async function confirmIt(id, ok) { await api('POST', '/bookings/' + bid() + '/confirm', {date: day(), staffId: id, available: ok}); msg('Recorded.'); loadManager(); }
async function swap(oldId) {
  const newId = +$('sw' + oldId).value;
  const r = await api('POST', '/bookings/' + bid() + '/reassign', {date: day(), oldId, newId});
  msg(r.swapped ? 'Swapped. New person is pending confirmation.' : 'Could not swap (replacement busy?)', r.swapped);
  loadManager();
}
async function dropIt(id) { await api('DELETE', '/bookings/' + bid() + '/assignments/' + id + '?date=' + day()); msg('Removed.'); loadManager(); }

// ---- 3. reports ----
async function loadReports() {
  const [conf, busy, multi, free] = await Promise.all([
    api('GET', '/bookings/' + bid() + '/confirmed?date=' + day()),
    api('GET', '/staff/busy?date=' + day()),
    api('GET', '/staff/multiple'),
    api('GET', '/staff/available?date=' + day())]);
  $('repBox').innerHTML =
    `<h3>Confirmed staff for booking ${esc(bid())}</h3>${list(conf)}
     <h3>Busy on ${esc(day())}</h3>${list(busy)}
     <h3>Free on ${esc(day())}</h3>${list(free)}
     <h3>Assigned to more than one event</h3>${list(multi)}`;
}

// ---- staff records ----
async function loadStaff() {
  staff = await api('GET', '/staff');
  $('staffTable').innerHTML = '<table><tr><th>ID</th><th>Name</th><th>Role</th><th>Type</th><th>Contact</th><th></th></tr>' +
    staff.map(s => `<tr><td>${s.id}</td><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${esc(s.type)}</td><td>${esc(s.contact)}</td>
      <td><button class="s" onclick="run(()=>delStaff(${s.id}))">Delete</button></td></tr>`).join('') + '</table>';
}
async function addStaff() {
  await api('POST', '/staff', {name: $('nName').value, role: $('nRole').value, type: $('nType').value, contact: $('nContact').value});
  msg('Staff added.'); ['nName', 'nRole', 'nContact'].forEach(i => $(i).value = ''); loadStaff();
}
async function delStaff(id) { await api('DELETE', '/staff/' + id); msg('Deleted.'); loadStaff(); }

$('bid').onchange = $('day').onchange = refresh;
refresh();
</script>
</body>
</html>
