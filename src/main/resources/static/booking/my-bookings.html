<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Bookings</title>
    <link rel="stylesheet" href="/booking/css/booking-theme.css">
</head>
<body>
<header>
    <h1>Rockhill Reception Hall &amp; Caterers</h1>
    <nav>
        <a href="/index.html">Home</a>
        <a href="/booking/booking.html">Make a booking</a>
    </nav>
</header>
<main>
    <div class="card">
        <h2>Find my bookings</h2>
        <label for="phone">Phone number used when booking</label>
        <input id="phone" maxlength="15">
        <button class="btn" id="findBtn" type="button">Find</button>
        <div id="msg" class="msg"></div>
    </div>
    <div class="card hidden" id="resultCard">
        <table>
            <thead><tr><th>#</th><th>Date</th><th>Type</th><th>Guests</th><th>Status</th><th>Deposit (Rs. 20,000)</th><th>Balance due</th><th></th></tr></thead>
            <tbody id="rows"></tbody>
        </table>
    </div>
</main>
<script src="/booking/js/booking-helpers.js"></script>
<script>
    async function load() {
        clearMsg('msg');
        const phone = document.getElementById('phone').value.trim();
        if (!phone) { showMsg('msg', 'Please enter your phone number.'); return; }
        try {
            const list = await api('/api/bookings/by-phone?phone=' + encodeURIComponent(phone));
            const body = document.getElementById('rows');
            body.innerHTML = '';
            document.getElementById('resultCard').classList.toggle('hidden', false);
            if (!list.length) { showMsg('msg', 'No bookings found for that phone number.'); return; }
            list.forEach(b => {
                const tr = document.createElement('tr');
                tr.appendChild(cell(b.id));
                tr.appendChild(cell(b.eventDate));
                tr.appendChild(cell(b.eventType === 'WEDDING' ? 'Wedding' : (b.eventDescription || 'Other event')));
                tr.appendChild(cell(b.guestCount));
                tr.appendChild(statusCell(b.status + (b.status === 'PENDING' && !b.submitted ? ' (draft)' : '')));
                let dep = '';
                if (b.status === 'PENDING') dep = b.approved ? 'Accepted - pay by ' + b.depositDueDate : (b.submitted ? 'Waiting for hall approval' : '');
                if (b.status === 'CONFIRMED') dep = 'Received';
                tr.appendChild(cell(dep));
                tr.appendChild(cell(b.status === 'CONFIRMED' || (b.status === 'PENDING' && b.approved) ? b.balanceDueDate : ''));
                const td = document.createElement('td');
                if (b.status === 'CONFIRMED' || (b.status === 'PENDING' && b.submitted)) {   // Pending includes accepted-awaiting-deposit
                    td.appendChild(actionButton('Reschedule', () => reschedule(b.id)));
                }
                if (b.status === 'PENDING' || b.status === 'CONFIRMED') {
                    td.appendChild(actionButton('Cancel', () => cancel(b.id), 'danger'));
                }
                tr.appendChild(td);
                body.appendChild(tr);
            });
        } catch (e) { showMsg('msg', e.message); }
    }
    async function reschedule(id) {
        try {
            const d = await askNewDate();
            if (!d) return;
            await api('/api/bookings/' + id + '/reschedule?newDate=' + encodeURIComponent(d) + '&byCustomer=true', { method: 'POST' });
            await load();
            showMsg('msg', 'Reschedule request sent. The booking is Pending until the hall approves the new date.', 'success');
        } catch (e) { showMsg('msg', e.message); }
    }
    async function cancel(id) {
        const reason = prompt('Reason for cancelling (optional):');
        if (reason === null) return;
        if (!confirm('Cancel booking #' + id + '? This releases the date.')) return;
        try {
            await api('/api/bookings/' + id + '/cancel', { method: 'POST', body: JSON.stringify({ reason: reason }) });
            await load();
            showMsg('msg', 'Booking #' + id + ' cancelled.', 'success');
        } catch (e) { showMsg('msg', e.message); }
    }
    document.getElementById('findBtn').addEventListener('click', load);
</script>
<script src="/js/portal.js" defer></script>
</body>
</html>
