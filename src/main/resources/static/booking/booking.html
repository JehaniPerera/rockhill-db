<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Booking - Rockhill Reception Hall</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<header>

    <h1>Rockhill Reception Hall</h1>

    <nav>

        <a href="index.html">Home</a>

        <a href="availability.html">Check Availability</a>

        <a href="booking.html">New Booking</a>

    </nav>

</header>


<main>

    <div class="card">

        <p class="small-title">
            ROCKHILL RECEPTION HALL
        </p>

        <h2>Make a Booking</h2>

        <p>
            Enter your customer and event details below.
        </p>


        <!-- ============================= -->
        <!-- Booking Form -->
        <!-- ============================= -->

        <form id="bookingForm">


            <!-- Customer Name -->

            <label for="customerName">
                Customer Name
            </label>

            <input
                    type="text"
                    id="customerName"
                    name="customerName"
                    placeholder="Enter your full name"
                    required
            >


            <!-- Phone -->

            <label for="phone">
                Phone Number
            </label>

            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
            >


            <!-- Email -->

            <label for="email">
                Email Address
            </label>

            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    required
            >


            <!-- Event Type -->

            <label for="eventType">
                Event Type
            </label>

            <select
                    id="eventType"
                    name="eventType"
                    required
            >

                <option value="">
                    Select Event Type
                </option>

                <option value="Wedding">
                    Wedding
                </option>

                <option value="Other">
                    Other
                </option>

            </select>


            <!-- Event Date -->

            <label for="eventDate">
                Event Date
            </label>

            <input
                    type="date"
                    id="eventDate"
                    name="eventDate"
                    required
            >


            <!-- Guest Count -->

            <label for="guestCount">
                Number of Guests
            </label>

            <input
                    type="number"
                    id="guestCount"
                    name="guestCount"
                    min="1"
                    placeholder="Enter number of guests"
                    required
            >


            <!-- ============================= -->
            <!-- Wedding Package -->
            <!-- ============================= -->

            <div
                    id="packageSection"
                    style="display: none;"
            >

                <label for="packageId">
                    Package ID
                </label>

                <input
                        type="number"
                        id="packageId"
                        name="packageId"
                        min="1"
                        placeholder="Enter package ID"
                >

                <p>
                    Wedding bookings require a package.
                </p>

            </div>


            <!-- ============================= -->
            <!-- Other Event Menu -->
            <!-- ============================= -->

            <div
                    id="menuSection"
                    style="display: none;"
            >

                <label for="menuId">
                    Menu ID
                </label>

                <input
                        type="number"
                        id="menuId"
                        name="menuId"
                        min="1"
                        placeholder="Enter menu ID"
                >

                <p>
                    Other events require a menu.
                </p>

            </div>


            <!-- Submit Button -->

            <button type="submit">
                Submit Booking
            </button>

        </form>


        <!-- Booking Result -->

        <p id="bookingMessage"></p>

    </div>

</main>


<!-- JavaScript -->

<script src="js/booking.js"></script>

</body>

</html>
