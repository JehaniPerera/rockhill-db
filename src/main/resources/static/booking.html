<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>New Booking - Rockhill Reception Hall</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <h1>Rockhill Reception Hall</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="availability.html">Check Availability</a>
        <a href="booking.html">New Booking</a>
    </nav>
</header>

<main>

    <div class="card">

        <p class="small-title">ROCKHILL RECEPTION HALL</p>

        <h2>Make a Booking</h2>

        <p>Please enter your event details below.</p>

        <form id="bookingForm">

            <!-- Customer Name -->
            <label for="customerName">Customer Name</label>
            <input
                    type="text"
                    id="customerName"
                    name="customerName"
                    placeholder="Enter your full name"
                    required
            >

            <!-- Phone -->
            <label for="phone">Phone Number</label>
            <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
            >

            <!-- Email -->
            <label for="email">Email Address</label>
            <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
            >

            <!-- Event Type -->
            <label for="eventType">Event Type</label>
            <select id="eventType" name="eventType" required>
                <option value="">Select Event Type</option>
                <option value="Wedding">Wedding</option>
                <option value="Other">Other</option>
            </select>

            <!-- Event Date -->
            <label for="eventDate">Event Date</label>
            <input
                    type="date"
                    id="eventDate"
                    name="eventDate"
                    required
            >

            <!-- Guest Count -->
            <label for="guestCount">Number of Guests</label>
            <input
                    type="number"
                    id="guestCount"
                    name="guestCount"
                    placeholder="Enter number of guests"
                    min="1"
                    required
            >

            <!-- Submit -->
            <button type="submit">Submit Booking</button>

        </form>

        <p id="bookingMessage"></p>

    </div>

</main>

<script src="js/booking.js"></script>

</body>
</html>
