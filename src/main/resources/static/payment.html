<!DOCTYPE html>
<html>
<head><title>Payments & Billing</title></head>
<body style="font-family: Arial; max-width: 600px; margin: 40px auto;">
<h2>Payments & Billing</h2>

<label>Booking ID: <input id="bookingId" type="number" value="1"></label>
<br><br>

<button onclick="payDeposit()">1. Pay Deposit (Rs. 20,000)</button>
<br><br>

<label>Total Price: <input id="totalPrice" type="number" value="590000"></label>
<button onclick="payBalance()">2. Pay Balance</button>
<br><br>

<button onclick="generateInvoice()">3. Generate Invoice</button>
<br><br>

<label><input id="venueDamaged" type="checkbox"> Venue Damaged</label>
<label><input id="cancelled" type="checkbox"> Booking Cancelled</label>
<button onclick="processRefund()">4. Process Refund</button>

<h3>Result:</h3>
<pre id="result" style="background:#f4f4f4; padding:10px; border-radius:5px;"></pre>

<script>
    function showResult(data) {
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
    async function payDeposit() {
        const bookingId = document.getElementById('bookingId').value;
        const res = await fetch(`/api/payments/deposit/${bookingId}`, { method: 'POST' });
        showResult(await res.json());
    }
    async function payBalance() {
        const bookingId = document.getElementById('bookingId').value;
        const totalPrice = document.getElementById('totalPrice').value;
        const res = await fetch(`/api/payments/balance/${bookingId}?totalPrice=${totalPrice}`, { method: 'POST' });
        showResult(await res.json());
    }
    async function generateInvoice() {
        const bookingId = document.getElementById('bookingId').value;
        const res = await fetch(`/api/payments/invoice/${bookingId}`, { method: 'POST' });
        showResult(await res.json());
    }
    async function processRefund() {
        const bookingId = document.getElementById('bookingId').value;
        const venueDamaged = document.getElementById('venueDamaged').checked;
        const cancelled = document.getElementById('cancelled').checked;
        const res = await fetch(`/api/payments/refund/${bookingId}?venueDamaged=${venueDamaged}&cancelled=${cancelled}`, { method: 'POST' });
        document.getElementById('result').textContent = await res.text();
    }
</script>
</body>
</html>
