<!DOCTYPE html>
<html>
<head><title>Payments & Billing</title></head>
<body style="font-family: Arial; max-width: 500px; margin: 40px auto;">
<h2>Record a Payment</h2>
<label>Booking ID: <input id="bookingId" type="number" value="1"></label><br><br>
<button onclick="payDeposit()">Pay Deposit (Rs. 20,000)</button>
<h3>Result:</h3>
<pre id="result"></pre>

<script>
    async function payDeposit() {
        const bookingId = document.getElementById('bookingId').value;
        const res = await fetch(`/api/payments/deposit/${bookingId}`, { method: 'POST' });
        const data = await res.json();
        document.getElementById('result').textContent = JSON.stringify(data, null, 2);
    }
</script>
</body>
</html>
