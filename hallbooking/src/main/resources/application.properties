spring.application.name=hallbooking
server.port=8080

# ---------- MySQL connection ----------
# Run the group's OOAD_Rockhill_Database.sql FIRST (it creates the 'rockhill' database).
spring.datasource.url=jdbc:mysql://localhost:3306/rockhill?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Colombo
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
